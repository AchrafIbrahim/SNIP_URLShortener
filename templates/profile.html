<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snip: Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/tabler-icons.min.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        background-color: #f5f5f5;
        min-height: 100vh;
        padding: 40px 16px;
      }

      /* Page wrapper */
      .profile-page {
        max-width: 560px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      /* Tombol kembali */
      .profile-btn-to-home {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: #7a7a7a;
        text-decoration: none;
        margin-bottom: 8px;
      }

      .profile-btn-to-home:hover {
        color: #1a1a1a;
      }

      /* Header */
      .profile-header h4 {
        font-size: 20px;
        font-weight: 500;
        margin-bottom: 4px;
      }

      .profile-header p {
        font-size: 13px;
        color: #7a7a7a;
      }

      /* Semua card */
      .profile-card-basic-info,
      .profile-card-change-password,
      .profile-card-statistics,
      .profile-card-deleteaccount {
        background-color: white;
        border-radius: 12px;
        overflow: hidden;
      }

      /* Card normal */
      .profile-card-basic-info,
      .profile-card-change-password,
      .profile-card-statistics {
        border: 1px solid #e0e0e0;
      }

      /* Card danger zone */
      .profile-card-deleteaccount {
        border: 1px solid #fbd0cc;
      }

      /* Judul tiap card */
      .profile-card-basic-info h5,
      .profile-card-change-password h5,
      .profile-card-statistics h5 {
        padding: 16px 20px;
        font-size: 13px;
        font-weight: 500;
        color: #1a1a1a;
      }

      .profile-card-deleteaccount h5 {
        padding: 16px 20px;
        font-size: 13px;
        font-weight: 500;
        color: #c0392b;
      }

      /* Divider */
      .divider {
        height: 1px;
        background-color: #e0e0e0;
      }

      .profile-card-deleteaccount .divider {
        background-color: #fbd0cc;
      }

      /* Avatar wrapper */
      .basic-info-avatar-wrapper {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 20px 20px 16px;
        border-bottom: 1px solid #e0e0e0;
      }

      .basic-info-avatar {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background-color: #1a1a1a;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        font-weight: 500;
        flex-shrink: 0;
      }

      .basic-info-name {
        font-size: 14px;
        font-weight: 500;
        margin-bottom: 2px;
      }

      .basic-info-email {
        font-size: 12px;
        color: #7a7a7a;
      }

      /* Form di dalam card */
      .profile-card-basic-info form,
      .profile-card-change-password form {
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      /* Field group */
      .field-name,
      .field-email,
      .field-password,
      .field-new-password,
      .field-confirm-new-password {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      label {
        font-size: 12px;
        color: #7a7a7a;
      }

      input {
        padding: 9px 12px;
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        font-size: 13px;
        width: 100%;
      }

      input:focus {
        outline: none;
        border-color: #1a1a1a;
      }

      input:disabled {
        background-color: #f5f5f5;
        color: #7a7a7a;
        cursor: not-allowed;
      }

      .field-email p {
        font-size: 11px;
        color: #b0b0b0;
      }

      /* Tombol simpan dan ganti password */
      .btn-change-profile,
      .btn-change-password {
        align-self: flex-end;
        padding: 8px 18px;
        background-color: #1a1a1a;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
      }

      .btn-change-profile:hover,
      .btn-change-password:hover {
        opacity: 0.85;
      }

      /* Statistik */
      .profile-card-statistics .total-link,
      .profile-card-statistics .total-klik,
      .profile-card-statistics .link-aktif {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 16px;
        background-color: #f5f5f5;
        border-radius: 10px;
        text-align: center;
      }

      .profile-card-statistics > div:not(.divider) {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        padding: 20px;
      }

      .total-link p,
      .total-klik p,
      .link-aktif p {
        font-size: 22px;
        font-weight: 500;
        font-family: monospace;
        margin-bottom: 4px;
      }

      .total-link label,
      .total-klik label,
      .link-aktif label {
        font-size: 11px;
        color: #7a7a7a;
      }

      /* Danger zone */
      .hapus-akun {
        padding: 20px;
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .hapus-akun-text {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .hapus-akun h5 {
        font-size: 13px;
        font-weight: 500;
        color: #1a1a1a;
        padding: 0;
        margin-bottom: 4px;
      }

      .hapus-akun p {
        font-size: 12px;
        color: #7a7a7a;
        line-height: 1.5;
      }

      .btn-hapus-akun {
        align-self: center;
        padding: 5px 16px;
        background-color: white;
        color: #c0392b;
        border: 1px solid #c0392b;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        white-space: nowrap;
        flex-shrink: 0;
      }

      .btn-hapus-akun:hover {
        background-color: #fdecea;
      }
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        padding: 20px;
      }
    </style>
  </head>
  <body>
    <script>
      const token = sessionStorage.getItem("token");
      if (!token) {
        window.location.href = "/login";
      }
    </script>
    <div class="profile-page">
      <a href="/main" class="profile-btn-to-home">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span>Kembali</span>
      </a>
      <div class="profile-header">
        <h4>Profil saya</h4>
        <p>Kelola informasi akun kamu</p>
      </div>
      <div class="profile-card-basic-info">
        <h5>Informasi dasar</h5>
        <div class="divider"></div>
        <div class="basic-info-avatar-wrapper">
          <div class="basic-info-avatar" id="avatar">AB</div>
          <div>
            <p class="basic-info-name">Ibrah Maula Setya Aji</p>
            <p class="basic-info-email">ibrahaji01@gmail.com</p>
          </div>
        </div>
        <form action="">
          <div class="field-name">
            <label for="name">Nama</label>
            <input type="text" id="nama" name="nama" value="Ibrah" />
          </div>
          <div class="field-email">
            <label for="email">Email</label>
            <input type="email" name="email" id="email" disabled />
            <p>Email tidak dapat diubah</p>
          </div>
          <button type="submit" class="btn-change-profile">Simpan Perubahan</button>
        </form>
      </div>
      <div class="profile-card-change-password">
        <h5>Ganti Password</h5>
        <div class="divider"></div>
        <form action="">
          <div class="field-password">
            <label for="current-password">Password saat ini</label>
            <input type="password" id="current-password" name="current-password" />
          </div>
          <div class="field-new-password">
            <label for="new-password">Password baru</label>
            <input type="password" name="new-password" id="new-password" />
          </div>
          <div class="field-confirm-new-password">
            <label for="confirm-new-password">Konfirmasi password baru</label>
            <input type="password" name="confirm-new-password" id="confirm-new-password" />
          </div>
          <button type="submit" class="btn-change-password">Ganti password</button>
        </form>
      </div>
      <div class="profile-card-statistics">
        <h5>Statistik akun</h5>
        <div class="divider"></div>
        <div class="stats-grid">
          <div class="total-link">
            <p>24</p>
            <label for="total-link">Total link</label>
          </div>
          <div class="total-klik">
            <p>8.4K</p>
            <label for="total-klik">Total klik</label>
          </div>
          <div class="link-aktif">
            <p>21</p>
            <label for="link-aktif">Link aktif</label>
          </div>
        </div>
      </div>
      <div class="profile-card-deleteaccount">
        <h5>Danger Zone</h5>
        <div class="divider"></div>
        <div class="hapus-akun">
          <div class="hapus-akun-text">
            <h5>Hapus akun</h5>
            <p>Semua link dan data kamu akan dihapus permanen. Tindakan ini tidak bisa dibatalkan</p>
          </div>
          <button type="submit" class="btn-hapus-akun">Hapus akun</button>
        </div>
      </div>
    </div>
  </body>
</html>
