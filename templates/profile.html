<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snip: Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/tabler-icons.min.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        background-color: #f5f5f5;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

  </head>
  <body>
    <script>
      const token = localStorage.getItem("token");
      if (!token) {
        window.location.href = "/login";
      }
    </script>
    <div class="profile-page">
      <a href="/main" class="profile-btn-to-home">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span>Kembali</span>
      </a>
      <div class="profile-header">
        <h4>Profil saya</h4>
        <p>Kelola informasi akun kamu</p>
      </div>
      <div class="profile-card-basic-info">
        <h5>Informasi dasar</h5>
        <div class="divider"></div>
        <div class="basic-info-avatar-wrapper">
          <div class="basic-info-avatar" id="avatar">AB</div>
          <div>
            <p class="basic-info-name">Ibrah Maula Setya Aji</p>
            <p class="basic-info-email">ibrahaji01@gmail.com</p>
          </div>
        </div>
        <form action="">
          <div class="field-name">
            <label for="name">Nama</label>
            <input type="text" id="nama" name="nama" value="Ibrah" />
          </div>
          <div class="field-email">
            <label for="email">Email</label>
            <input type="email" name="email" id="email" disabled />
            <p>Email tidak dapat diubah</p>
          </div>
          <button type="submit" class="btn-change-profile">Simpan Perubahan</button>
        </form>
      </div>
      <div class="profile-card-change-password">
        <h5>Ganti Password</h5>
        <div class="divider"></div>
        <form action="">
          <div class="field-password">
            <label for="current-password">Password saat ini</label>
            <input type="password" id="current-password" name="current-password" />
          </div>
          <div class="field-new-password">
            <label for="new-password">Password baru</label>
            <input type="password" name="new-password" id="new-password" />
          </div>
          <div class="field-confirm-new-password">
            <label for="confirm-new-password">Konfirmasi password baru</label>
            <input type="password" name="confirm-new-password" id="confirm-new-password" />
          </div>
          <button type="submit" class="btn-change-password">Ganti password</button>
        </form>
      </div>
      <div class="profile-card-statistics">
        <h5>Statistik akun</h5>
        <div class="divider"></div>
        <div class="total-link">
          <p>24</p>
          <label for="total-link">Total link</label>
        </div>
        <div class="total-klik">
          <p>8.4K</p>
          <label for="total-klik">Total klik</label>
        </div>
        <div class="link-aktif">
          <p>21</p>
          <label for="link-aktif">Link aktif</label>
        </div>
      </div>
      <div class="profile-card-deleteaccount">
        <h5>Danger Zone</h5>
        <div class="divider"></div>
        <div class="hapus-akun">
          <h5>Hapus akun</h5>
          <p>Semua link dan data kamu akan dihapus permanen. Tindakan ini tidak bisa dibatalkan</p>
          <button type="submit" class="btn-hapus-akun">Hapus akun</button>
        </div>
      </div>
    </div>
  </body>
</html>
