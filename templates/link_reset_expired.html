<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snip: Expired link</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/tabler-icons.min.css" />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        background-color: #f5f5f5;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .link-reset-expired-card {
        background-color: white;
        border: 1px solid #e0e0e0;
        border-radius: 14px;
        padding: 32px 28px;
        width: 320px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .link-reset-expired-icon {
        width: 40px;
        height: 40px;
        background-color: #1a1a1a;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 12px;
        color: white;
        font-size: 18px;
      }

      .link-reset-expired-icon i {
        color: white;
        font-size: 18px;
      }

      .link-reset-expired-header h3 {
        font-size: 18px;
        font-weight: 500;
        margin-bottom: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .link-reset-expired-header p {
        font-size: 13px;
        color: #7a7a7a;
        margin-bottom: 24px;
        text-align: center;
      }

      form {
        width: 100%;
      }

      label {
        font-size: 13px;
        color: #7a7a7a;
      }

      input {
        padding: 10px 12px;
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        font-size: 14px;
        width: 100%;
      }

      input:focus {
        outline: none;
        border-color: #1a1a1a;
      }

      .btn-new-link button {
        width: 100%;
        padding: 12px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        margin-bottom: 16px;
      }

      .btn-new-link-snip {
        background-color: #1a1a1a;
        color: white;
        border: solid 1px #e0e0e0;
        border-radius: 8px;
      }

      .btn-new-link button:hover {
        opacity: 0.85;
      }

      .btn-to-login {
        text-align: center;
      }

      .btn-to-login a {
        color: #1a1a1a;
        font-weight: 400;
        text-decoration: none;
        margin-left: 4px;
        font-size: 13px;
      }

      .btn-to-login-icon {
        vertical-align: text-bottom;
      }
    </style>
  </head>
  <body>
    <div class="link-reset-expired-card">
      <div class="link-reset-expired-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
      </div>
      <div class="link-reset-expired-header">
        <h3>Link sudah tidak berlaku</h3>
        <p>Link reset password ini sudah kedaluwarsa atau tidak valid. silakan minta link baru</p>
      </div>
      <form action="">
        <div class="btn-new-link">
          <button type="button" class="btn-new-link-snip" onclick="window.location.href = '/forgot-password'"><strong>Minta link baru</strong></button>
        </div>
        <div class="btn-to-login">
          <a href="/login">
            <svg class="btn-to-login-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="19" y1="12" x2="5" y2="12"></line>
              <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Kembali ke halaman masuk
          </a>
        </div>
      </form>
    </div>
  </body>
</html>
