<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snip: Success reset password</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/tabler-icons.min.css" />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        background-color: #f5f5f5;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .success-reset-password-card {
        background-color: white;
        border: 1px solid #e0e0e0;
        border-radius: 14px;
        padding: 32px 28px;
        width: 320px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .success-reset-password-icon {
        width: 40px;
        height: 40px;
        background-color: #1a1a1a;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 12px;
        color: white;
        font-size: 18px;
      }

      .success-reset-password-icon i {
        color: white;
        font-size: 18px;
      }

      .success-reset-password-header h3 {
        font-size: 18px;
        font-weight: 500;
        margin-bottom: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .success-reset-password-header p {
        font-size: 13px;
        color: #7a7a7a;
        margin-bottom: 24px;
        text-align: center;
      }

      form {
        width: 100%;
      }

      label {
        font-size: 13px;
        color: #7a7a7a;
      }

      input {
        padding: 10px 12px;
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        font-size: 14px;
        width: 100%;
      }

      input:focus {
        outline: none;
        border-color: #1a1a1a;
      }

      .btn-to-login button {
        width: 100%;
        padding: 12px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
      }

      .btn-to-login-snip {
        background-color: #1a1a1a;
        color: white;
        border: solid 1px #e0e0e0;
        border-radius: 8px;
      }

      .btn-to-login button:hover {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div class="success-reset-password-card">
      <div class="success-reset-password-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>
      <div class="success-reset-password-header">
        <h3>Password berhasil diubah</h3>
        <p>Password kamu sudah diperbarui. Silakan masuk dengan password baru</p>
      </div>
      <form action="">
        <div class="btn-to-login">
          <button type="button" class="btn-to-login-snip" onclick="window.location.href = '/login'"><strong>Masuk sekarang</strong></button>
        </div>
      </form>
    </div>
  </body>
</html>
