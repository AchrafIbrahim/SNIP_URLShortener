<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snip: New password</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/tabler-icons.min.css" />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        background-color: #f5f5f5;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .new-password-card {
        background-color: white;
        border: 1px solid #e0e0e0;
        border-radius: 14px;
        padding: 32px 28px;
        width: 320px;
        display: flex;
        flex-direction: column;
        align-items: center;
        margin: 20px;
      }

      .new-password-icon {
        width: 40px;
        height: 40px;
        background-color: #1a1a1a;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 12px;
        color: white;
        font-size: 18px;
      }

      .new-password-icon i {
        color: white;
        font-size: 18px;
      }

      .new-password-header h3 {
        font-size: 18px;
        font-weight: 500;
        margin-bottom: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .new-password-header p {
        font-size: 13px;
        color: #7a7a7a;
        margin-bottom: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      form {
        width: 100%;
      }

      .form-input-new-password,
      .form-input-confirm-new-password {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-bottom: 14px;
        width: 100%;
      }

      label {
        font-size: 13px;
        color: #7a7a7a;
      }

      input {
        padding: 10px 12px;
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        font-size: 14px;
        width: 100%;
      }

      input:focus {
        outline: none;
        border-color: #1a1a1a;
      }

      .password-wrapper {
        position: relative;
        width: 100%;
      }

      .password-wrapper input {
        padding-right: 40px;
      }

      .toggle-password {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
        display: flex;
        align-items: center;
      }

      .btn-forgetpassword {
        text-align: right;
        margin-bottom: 18px;
      }

      .btn-forgetpassword a {
        font-size: 12px;
        color: #7a7a7a;
        text-decoration: none;
      }

      .btn-new-password button {
        width: 100%;
        padding: 12px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
      }

      .btn-new-password-snip {
        background-color: #1a1a1a;
        color: white;
        border: none;
        border-radius: 8px;
      }

      .btn-new-password button:hover {
        opacity: 0.85;
      }

      .btn-to-register {
        text-align: center;
      }

      .btn-to-register p {
        font-size: 13px;
        color: #7a7a7a;
      }

      .btn-to-register a {
        color: #1a1a1a;
        font-weight: 500;
        text-decoration: none;
        margin-left: 4px;
      }
      .btn-to-login {
        text-align: center;
        margin-top: 20px;
      }

      .btn-to-login a {
        color: #1a1a1a;
        font-weight: 400;
        text-decoration: none;
        margin-left: 4px;
        font-size: 13px;
      }

      .btn-to-login-icon {
        vertical-align: text-bottom;
      }

      #password-error {
        font-size: 12px;
        color: #c0392b;
        margin-top: 4px;
        display: block;
      }
    </style>
  </head>
  <body>
    <script>
      function togglepassword(inputId, openId, closeId) {
        const input = document.getElementById(inputId);
        const eyeOpen = document.getElementById(openId);
        const eyeClosed = document.getElementById(closeId);
        const isPassword = input.type === "password";
        input.type = isPassword ? "text" : "password";
        eyeOpen.style.display = isPassword ? "none" : "block";
        eyeClosed.style.display = isPassword ? "block" : "none";
      }

      <!--Check Match Password Function-->
      function checkPasswordMatch() {
        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirm-password").value;
        const errorMsg = document.getElementById("password-error");

        if (password !== confirmPassword) {
          errorMsg.textContent = "Password tidak cocok";
        } else {
          errorMsg.textContent = "";
        }
      }

      // Ambil token dari URL saat halaman dibuka
      const urlParams = new URLSearchParams(window.location.search);
      const resetToken = urlParams.get("token");

      // Kalau tidak ada token, redirect ke link expired
      if (!resetToken) {
        window.location.href = "/link-reset-expired";
      }
      // Validasi token saat halaman dibuka
      async function validateToken() {
        try {
          const response = await fetch("/validate-reset-token?token=" + resetToken);
          if (!response.ok) {
            window.location.href = "/link-reset-expired";
          }
        } catch (error) {
          window.location.href = "/link-reset-expired";
        }
      }

      validateToken();

      async function handleResetPassword(event) {
        event.preventDefault();

        const btn = document.querySelector('button[type="submit"]');
        btn.disabled = true;
        btn.textContent = "Memproses...";

        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirm-password").value;

        // Validasi password match
        if (password !== confirmPassword) {
          document.getElementById("password-error").textContent = "Password tidak cocok";
          btn.disabled = false;
          btn.textContent = "Reset";
          return;
        }

        try {
          const response = await fetch("/reset-password", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              token: resetToken,
              password: password,
            }),
          });

          const data = await response.json();

          if (response.ok) {
            window.location.href = "/success-reset-password";
          } else {
            if (data.error.includes("kedaluwarsa") || data.error.includes("tidak valid")) {
              window.location.href = "/link-reset-expired";
            } else {
              alert(data.error);
              btn.disabled = false;
              btn.textContent = "Reset";
            }
          }
        } catch (error) {
          alert("Terjadi kesalahan, coba lagi");
          btn.disabled = false;
          btn.textContent = "Reset";
        }
      }

      function validatePassword() {
        const password = document.getElementById("password").value;
        const errorMsg = document.getElementById("password-error");

        if (password.length < 6) {
          errorMsg.textContent = "Password length minimum 6 characters";
        } else {
          errorMsg.textContent = "";
        }
      }
    </script>
    <div class="new-password-card">
      <div class="new-password-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <div class="new-password-header">
        <h3>Buat password baru</h3>
        <p>Buat password baru kamu</p>
      </div>
      <form action="" onsubmit="handleResetPassword(event)">
        <div class="form-input-new-password">
          <label for="password">New password</label>
          <div class="password-wrapper">
            <input type="password" name="password" id="password" onkeyup="validatePassword()" />
            <span class="toggle-password" onclick="togglepassword('password', 'eye-open', 'eye-closed')">
              <svg id="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7a7a7a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg id="eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7a7a7a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none">
                <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path>
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path>
                <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </span>
          </div>
        </div>
        <div class="form-input-confirm-new-password">
          <label for="password">Confirm new Password</label>
          <div class="password-wrapper">
            <input type="password" name="confirm-password" id="confirm-password" onkeyup="checkPasswordMatch()" />
            <span class="toggle-password" onclick="togglepassword('confirm-password', 'eye-open-confirm', 'eye-closed-confirm')">
              <svg id="eye-open-confirm" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7a7a7a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg id="eye-closed-confirm" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7a7a7a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none">
                <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path>
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path>
                <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </span>
          </div>
          <span id="password-error"></span>
        </div>
        <div class="btn-new-password">
          <button type="submit" class="btn-new-password-snip">Reset</button>
        </div>
        <div class="btn-to-login">
          <a href="/login">
            <svg class="btn-to-login-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="19" y1="12" x2="5" y2="12"></line>
              <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Kembali ke halaman masuk
          </a>
        </div>
      </form>
    </div>
  </body>
</html>
