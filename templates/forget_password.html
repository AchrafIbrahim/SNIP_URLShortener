<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snip: Forget password</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/tabler-icons.min.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        background-color: #f5f5f5;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .forget-password-card {
        background-color: white;
        border: 1px solid #e0e0e0;
        border-radius: 14px;
        padding: 32px 28px;
        width: 320px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .forget-password-icon {
        width: 40px;
        height: 40px;
        background-color: #1a1a1a;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 12px;
        color: white;
        font-size: 18px;
      }

      .forget-password-icon i {
        color: white;
        font-size: 18px;
      }

      .forget-password-header h3 {
        font-size: 18px;
        font-weight: 500;
        margin-bottom: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .forget-password-header p {
        font-size: 13px;
        color: #7a7a7a;
        margin-bottom: 24px;
        text-align: center;
      }

      form {
        width: 100%;
      }

      .form-input-email {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-bottom: 14px;
        width: 100%;
      }

      label {
        font-size: 13px;
        color: #7a7a7a;
      }

      input {
        padding: 10px 12px;
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        font-size: 14px;
        width: 100%;
      }

      input:focus {
        outline: none;
        border-color: #1a1a1a;
      }

      .btn-forget-password button {
        width: 100%;
        padding: 12px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        margin-bottom: 16px;
      }

      .btn-forget-password-snip {
        background-color: #1a1a1a;
        color: white;
        border: none;
        border-radius: 8px;
      }

      .btn-forget-password button:hover {
        opacity: 0.85;
      }

      .btn-to-login {
        text-align: center;
      }

      .btn-to-login a {
        color: #1a1a1a;
        font-weight: 400;
        text-decoration: none;
        margin-left: 4px;
        font-size: 13px;
      }

      .btn-to-login-icon {
        vertical-align: text-bottom;
      }
    </style>
  </head>
  <body>
    <script>
      async function handleForgotPassword(event) {
        event.preventDefault();

        const btn = document.querySelector('button[type="submit"]');
        btn.disabled = true;
        btn.textContent = "Memproses...";

        const email = document.getElementById("email").value;

        try {
          const response = await fetch("/forgot-password", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ email: email }),
          });

          const data = await response.json();

          if (response.ok) {
            window.location.href = "/email-check-reset-password";
          } else {
            alert(data.error);
            btn.disabled = false;
            btn.textContent = "Kirim link reset";
          }
        } catch (error) {
          alert("Terjadi kesalahan, coba lagi");
          btn.disabled = false;
          btn.textContent = "Kirim link reset";
        }
      }
    </script>
    <div class="forget-password-card">
      <div class="forget-password-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <div class="forget-password-header">
        <h3>Lupa password?</h3>
        <p>Masukkan email kamu, kami akan kirim link untuk reset password</p>
      </div>
      <form action="" onsubmit="handleForgotPassword(event)">
        <div class="form-input-email">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" />
        </div>
        <div class="btn-forget-password">
          <button type="submit" class="btn-forget-password-snip">Kirim link reset</button>
        </div>
        <div class="btn-to-login">
          <a href="/login">
            <svg class="btn-to-login-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="19" y1="12" x2="5" y2="12"></line>
              <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Kembali ke halaman masuk
          </a>
        </div>
      </form>
    </div>
  </body>
</html>
